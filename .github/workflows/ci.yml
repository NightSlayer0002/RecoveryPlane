name: Verify RecoveryPlane
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recoveryplane
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: recoveryplane
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recoveryplane"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:postgres
        env:
          TEST_DATABASE_URL: postgresql://recoveryplane:test-only-password@127.0.0.1:5432/recoveryplane
